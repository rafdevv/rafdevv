<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-label="Fictional Nmap terminal output for a demo-only host">
  <rect width="840" height="330" rx="12" fill="#0d1117" stroke="#30363d" />
  <rect width="840" height="38" rx="12" fill="#161b22" />
  <circle cx="22" cy="19" r="5" fill="#ff7b72" />
  <circle cx="42" cy="19" r="5" fill="#d29922" />
  <circle cx="62" cy="19" r="5" fill="#3fb950" />
  <text x="420" y="24" fill="#c9d1d9" font-family="Consolas, 'Courier New', monospace" font-size="13" text-anchor="middle">demo terminal</text>
  <g fill="#c9d1d9" font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="24" y="76" fill="#7ee787">student@lab:~$</text>
    <text x="171" y="76">nmap -sV -p 22,80 lab-demo.invalid</text>
